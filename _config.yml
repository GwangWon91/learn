title: SKALA 학습 기록
description: SKALA 교육 학습 일지
theme: minima

header_pages:
  - about.md
  - projects.md
  - tags.md

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - README.md
  - scripts